# nixpacks.toml — Nixpacks build config for ResumeForge API on Railway
# This overrides Railway/Nixpacks defaults for the pnpm monorepo.

[phases.setup]
  nixPkgs = ["nodejs_20"]

[phases.install]
  cmds = [
    "npm install -g pnpm@9",
    "pnpm install --no-frozen-lockfile"
  ]

[phases.build]
  cmds = [
    "pnpm --filter @resumeforge/shared build",
    "pnpm --filter resumeforge-api build"
  ]

[start]
  cmd = "node apps/api/dist/main.js"
